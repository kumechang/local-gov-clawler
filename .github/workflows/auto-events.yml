name: auto-events
# mainへのマージで、config/auto_events.json の対象のイベント詳細の取り出しを自動実行する(D-137)。
# 安全策は auto-crawl と同じ:
#  - config/auto_events.json、ワード設定、調査用ワークフローを変更したときだけ動く
#  - 結果が既にある (keyword, route) は実行しない(新しい route 名にする)
#  - config の enabled=false、またはコミットメッセージの [skip events] で止まる
on:
  push:
    branches: [main]
    paths:
      - "config/auto_events.json"
      - "config/keywords/**"
      - "config/survey_sets/**"
      - ".github/workflows/events.yml"
      - ".github/workflows/auto-events.yml"
  workflow_dispatch:

concurrency:
  group: auto-events
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.p.outputs.count }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: p
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/plan_auto_events.py

  events:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/events.yml
    with:
      prefecture: ${{ matrix.prefecture }}
      keyword: ${{ matrix.keyword }}
      route: ${{ matrix.route }}
      shards: ${{ matrix.shards }}
      survey_set: ${{ matrix.survey_set }}
      commit_results: true
    permissions:
      contents: write
    secrets: inherit
