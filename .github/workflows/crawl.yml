name: crawl
# 手動実行(workflow_dispatch)と、auto-crawl.yml からの呼び出し(workflow_call)。
# 自治体サイトへのアクセスが発生するため、定期実行にはしていない(docs/decisions.md D-007)。
on:
  workflow_call:
    inputs:
      prefecture:
        type: string
        default: 奈良県
      route:
        type: string
        default: actions_direct
      use_proxy:
        type: boolean
        default: false
      shards:
        type: string
        default: "1"
      commit_results:
        type: boolean
        default: false
      scope:
        type: string
        default: ""
      compact:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      prefecture:
        description: 対象の都道府県名(例 奈良県)。空なら全国
        default: 奈良県
      route:
        description: 取得経路ラベル(actions_direct / proxy)。結果の保存先ディレクトリ名になる
        default: actions_direct
      use_proxy:
        description: Secret CRAWL_PROXY_URL の国内プロキシ経由で取得する
        type: boolean
        default: false
      shards:
        description: シャード数(全国実行時は20程度)
        default: "1"
      commit_results:
        description: 結果JSONとサマリをこのブランチへコミットする
        type: boolean
        default: false
      scope:
        description: 空=すべて / municipality=政令市の区を除く / designated_city_ward=区のみ
        default: ""
      compact:
        description: 軽量形式で保存する(サイト内リンク一覧を捨てる。全国実行用)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARDS"])
          assert 1 <= n <= 256
          print("shards=" + json.dumps(list(range(n))))
          PY

  crawl:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: crawl
        env:
          PREFECTURE: ${{ inputs.prefecture }}
          ROUTE: ${{ inputs.route }}
          TOTAL: ${{ inputs.shards }}
          SHARD: ${{ matrix.shard }}
          USE_PROXY: ${{ inputs.use_proxy }}
          SCOPE: ${{ inputs.scope }}
          COMPACT: ${{ inputs.compact }}
          CRAWL_PROXY_URL: ${{ secrets.CRAWL_PROXY_URL }}
        run: |
          args=(run --route "$ROUTE" --shard "$SHARD/$TOTAL" --out out/results --save-html out/raw)
          if [ -n "$PREFECTURE" ]; then args+=(--prefecture "$PREFECTURE"); fi
          if [ "$USE_PROXY" = "true" ]; then args+=(--use-proxy); fi
          if [ -n "$SCOPE" ]; then args+=(--scope "$SCOPE"); fi
          if [ "$COMPACT" = "true" ]; then args+=(--compact); fi
          localgov-crawler "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.route }}-${{ matrix.shard }}
          path: out/results
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ inputs.route }}-${{ matrix.shard }}
          path: out/raw
          retention-days: 14
          if-no-files-found: ignore

  merge:
    needs: [plan, crawl]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: results-${{ inputs.route }}-*
          path: collected
          merge-multiple: true
      - name: merge and summarize
        env:
          ROUTE: ${{ inputs.route }}
          PREFECTURE: ${{ inputs.prefecture }}
        run: |
          mkdir -p data/results
          cp -r collected/. data/results/
          localgov-crawler summarize --route "$ROUTE"
          db_args=(merge-db --route "$ROUTE" --db out/crawl.sqlite)
          if [ -n "$PREFECTURE" ]; then db_args+=(--prefecture "$PREFECTURE"); fi
          localgov-crawler "${db_args[@]}"
          cat "data/summary/$ROUTE.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-sqlite-${{ inputs.route }}
          path: out/crawl.sqlite
          retention-days: 30
      - name: commit results
        if: ${{ inputs.commit_results }}
        env:
          ROUTE: ${{ inputs.route }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results data/summary
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: crawl results (route=$ROUTE)"
          # 複数の実行が同時にコミットすることがあるので、押し返されたら取り込み直して再試行する
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 3))
          done
          echo "push に失敗しました" >&2
          exit 1
