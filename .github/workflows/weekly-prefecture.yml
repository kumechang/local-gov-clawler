name: weekly-prefecture
# 毎週の自動実行(weekly-batch.yml)の、1県ぶんの流れ(D-154)。
# 同じ自治体のサイトへ同時に2本のアクセスをしない(1ホスト1リクエスト/秒以下を守るため)ので、1県の中は順番に動かす(D-159):
#   ワード調査(PDF+OCR) → ワード調査(イベント探索) → 施設の詳細 → イベントの詳細
# どの段階も、結果は呼び出し元のブランチ(定期実行ならmain)へコミットする。
on:
  workflow_call:
    inputs:
      prefecture:
        type: string
        required: true
      keyword:
        type: string
        required: true
      from_route:
        type: string
        required: true
      shards:
        type: string
        default: "1"
      facility_route:
        type: string
        required: true
      event_route:
        type: string
        required: true
      detail_route:
        type: string
        required: true
      details_only:
        type: string
        default: ""
      facility_max_pdfs:
        type: string
        default: "40"
      follow_external:
        type: string
        default: ""
      facility_max_pages:
        type: string
        default: "200"
      event_max_pages:
        type: string
        default: "300"

permissions:
  contents: read

jobs:
  survey_facility:
    if: ${{ inputs.details_only == '' }}
    uses: ./.github/workflows/survey.yml
    with:
      prefecture: ${{ inputs.prefecture }}
      keyword: ${{ inputs.keyword }}
      route: ${{ inputs.facility_route }}
      from_route: ${{ inputs.from_route }}
      shards: ${{ inputs.shards }}
      max_pages: ${{ inputs.facility_max_pages }}
      read_pdf: "1"
      ocr_pdf: "1"
      max_pdfs: ${{ inputs.facility_max_pdfs }}
      follow_external: ${{ inputs.follow_external }}
      save_text: "1"
      commit_results: true
    permissions:
      contents: write

  survey_event:
    needs: survey_facility
    if: ${{ !cancelled() && inputs.details_only == '' && needs.survey_facility.result != 'cancelled' }}
    uses: ./.github/workflows/survey.yml
    with:
      prefecture: ${{ inputs.prefecture }}
      keyword: ${{ inputs.keyword }}
      route: ${{ inputs.event_route }}
      from_route: ${{ inputs.from_route }}
      shards: ${{ inputs.shards }}
      max_pages: ${{ inputs.event_max_pages }}
      event_focus: "1"
      save_text: "1"
      commit_results: true
    permissions:
      contents: write

  extract:
    needs: [survey_facility, survey_event]
    if: ${{ !cancelled() && (needs.survey_facility.result == 'success' || needs.survey_facility.result == 'skipped') }}
    uses: ./.github/workflows/extract.yml
    with:
      prefecture: ${{ inputs.prefecture }}
      keyword: ${{ inputs.keyword }}
      route: ${{ inputs.detail_route }}
      survey_set: weekly_facility
      shards: "1"
      commit_results: true
    permissions:
      contents: write

  events:
    needs: [survey_facility, survey_event, extract]
    # どちらかの調査が終われば取り出す(片方が落ちても、もう片方のぶんは取り出す)。施設の詳細(extract)が終わってから(同時にアクセスしない)
    if: ${{ !cancelled() && (needs.survey_facility.result == 'success' || needs.survey_facility.result == 'skipped' || needs.survey_event.result == 'success') }}
    uses: ./.github/workflows/events.yml
    with:
      prefecture: ${{ inputs.prefecture }}
      keyword: ${{ inputs.keyword }}
      route: ${{ inputs.detail_route }}
      survey_set: weekly_events
      shards: "1"
      commit_results: true
    permissions:
      contents: write
